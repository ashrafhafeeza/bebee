<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayanggg💖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #ffe6f0, #fff0f5, #ffffff);
      overflow: hidden;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 25px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .profile-img-wrapper {
      width: 260px;
      height: 260px;
      margin: 0 auto 15px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(255, 105, 135, 0.5);
    }

    .profile-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 27%;
      /* fokus ke bagian atas/kepala */
    }

    h1,
    h2 {
      color: #e91e63;
      font-size: 1.8rem;
      margin: 10px 0 5px;
    }

    p {
      color: #c2185b;
      font-size: 0.9rem;
      margin-bottom: 15px;
      min-height: 50px;
    }

    .btn {
      padding: 10px 25px;
      border-radius: 12px;
      font-weight: bold;
      background: linear-gradient(to right, #ff4081, #f06292);
      color: #fff;
      transition: 0.2s;
      position: relative;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .typing {
      color: #880e4f;
      font-weight: 500;
      font-size: 1rem;
      min-height: 50px;
      margin: 15px 0;
    }

    .bear-gif {
      width: 256px;
      height: 256px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .gif-title {
      color: #ad1457;
      font-weight: bold;
      font-size: 1.2rem;
      margin: 10px 0;
    }

    .heart {
      position: absolute;
      width: 15px;
      height: 15px;
      background: linear-gradient(45deg, #ff6b81, #ff9aa2);
      transform: rotate(45deg);
      animation: heartRise 4.8s linear forwards;
      border-radius: 3px;
      opacity: 0.9;
    }

    @keyframes heartRise {
      0% {
        transform: translateY(0) rotate(45deg) scale(1);
        opacity: 0.95;
      }

      100% {
        transform: translateY(-420px) rotate(250deg) scale(0.55);
        opacity: 0;
      }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <!-- STEP 1 -->
  <div class="card" id="step1">
    <div class="profile-img-wrapper"><img src="assets/images/bbeee.jpeg" alt="Dwi"></div>
    <div class="typing" id="typed1"></div>
    <div class="typing" id="typedP"></div>
    <button class="btn" id="haloBtn">Halo ✨</button>
  </div>

  <!-- STEP 2 -->
  <div class="card" id="step2" style="display:none;">
    <div class="profile-img-wrapper"><img src="assets/images/au.jpg" alt="Ashraf"></div>
    <h2 id="nameStep2"></h2>
    <div class="typing" id="typedQuestion2"></div>
    <button class="btn" id="btnBoleh">Boleh 😘</button>
    <button class="btn" id="btnGaBoleh">Ga Boleh 😤</button>
  </div>

  <!-- STEP GOMBAL -->
  <div class="card" id="stepGombal" style="display:none;">
    <div class="typing" id="typedQuestion"></div>
    <div class="typing" id="typedAnswer"></div>
    <div style="margin-top:10px;">
      <button class="btn" id="btnTau">Tau 😏</button>
      <button class="btn" id="btnNgga">Ngga Tau 😅</button>
    </div>
    <div style="margin-top:15px;display:none;" id="askAgainDiv">
      <p>Mau lagi nggak sayang? 💖</p>
      <button class="btn" id="btnMau">Mau 😍</button>
      <button class="btn" id="btnGakMau">Ngga 😤</button>
    </div>
  </div>

  <!-- STEP 5 GIF -->
  <div class="card" id="step5" style="display:none;">
    <img src="https://media1.tenor.com/m/XxeAtG5jd8sAAAAd/milk-and-mocha-bear-kiss.gif" class="bear-gif">
    <div class="gif-title">Cium dulu dong 😚</div>
    <button class="btn" id="repeatBtn">Ulangi 💕</button>
  </div>


  <audio id="bgAudio" src="assets/audio/sweet-melody.mp3" loop></audio>

  <script>
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const stepGombal = document.getElementById('stepGombal');
    const step5 = document.getElementById('step5');

    const haloBtn = document.getElementById('haloBtn');
    const audio = document.getElementById('bgAudio');

    const nameStep2 = document.getElementById('nameStep2');
    const typedQuestion2 = document.getElementById('typedQuestion2');
    const btnBoleh = document.getElementById('btnBoleh');
    const btnGaBoleh = document.getElementById('btnGaBoleh');

    const typedQuestion = document.getElementById('typedQuestion');
    const typedAnswer = document.getElementById('typedAnswer');
    const btnTau = document.getElementById('btnTau');
    const btnNgga = document.getElementById('btnNgga');
    const btnMau = document.getElementById('btnMau');
    const btnGakMau = document.getElementById('btnGakMau');
    const askAgainDiv = document.getElementById('askAgainDiv');
    const repeatBtn = document.getElementById('repeatBtn');

    let currentGombalan = [], currentIndex = 0;

    // TYPEWRITER
    function typeText(el, txt, speed = 50, cb) {
      el.textContent = ''; let i = 0;
      function t() { if (i <= txt.length) { el.textContent = txt.slice(0, i) + '|'; i++; setTimeout(t, speed); } else { el.textContent = txt; if (cb) cb(); } }
      t();
    }

    // RESET BUTTON POSITION
    function resetButtonPos(btn) {
      btn.style.position = 'relative';
      btn.style.left = '';
      btn.style.top = '';
    }

    // RANDOM POSITION
    function randomPos(btn) {
      const card = btn.parentElement;
      const cardRect = card.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const x = Math.random() * (cardRect.width - btnRect.width - 20);
      const y = Math.random() * (cardRect.height - btnRect.height - 20);
      btn.style.position = 'absolute'; btn.style.left = x + 'px'; btn.style.top = y + 'px';
    }

    // STEP 1
    typeText(document.getElementById('typed1'), 'Hai Dwi Aprillia Rufaindah 💖', 70, () => {
      typeText(document.getElementById('typedP'), 'Dengerin lagunya dulu ya, terus tekan tombol Halo — ada sesuatu yang manis setelahnya.', 40);
    });
    haloBtn.onclick = () => {
      step1.style.display = 'none';
      step2.style.display = 'block';
      audio.play().catch(() => { });
      typeText(nameStep2, 'Aku, Ashraf El Hafieza Rusmana 💫', 60, () => {
        typeText(typedQuestion2, 'Aku boleh gombal sedikit gaa? 😳', 50);
      });
    };

    // STEP 2
    btnGaBoleh.onclick = () => randomPos(btnGaBoleh);
    btnBoleh.onclick = () => {
      step2.style.display = 'none';
      stepGombal.style.display = 'block';
      currentGombalan = [...gombalanAwal];
      currentIndex = 0;
      showGombal();
    };

    // GOMBAL DATA
    const gombalanAwal = [
      { q: 'Tau nggak bedanya kamu sama jam 12 siang?', a: 'Kalau jam 12 itu kesiangan, Kalau kamu itu kesayangan 😍' },
      { q: 'Tau nggak bedanya kamu sama matahari?', a: 'Kalau matahari itu selalu bikin terang, Kalau kamu selalu bikin hatiku senang 💘' },
      { q: 'Tau nggak bedanya kamu sama pelangi?', a: 'Kalau pelangi itu muncul sesekali, Kalau kamu selalu bikin hariku berwarna 🌈' }
    ];
    const gombalanSisa = [
      { q: 'Tau nggak bedanya kamu sama bulan?', a: 'Kalau bulan cuma muncul di malam hari, Kalau kamu selalu muncul kapanpun di pikiranku 🌙' },
      { q: 'Tau nggak bedanya kamu sama bintang?', a: 'Kalau bintang jauh di atas langit, Kalau kamu deket banget di hatiku ✨' },
      { q: 'Tau nggak bedanya kamu sama kue cokelat?', a: 'Kalau kue cokelat bikin sakit gigi, Kalau kamu bikin aku senyum nggak berhenti 🍫' }
    ];

    // SHOW GOMBAL
    function showGombal() {
      typedAnswer.textContent = '';
      askAgainDiv.style.display = 'none';
      const g = currentGombalan[currentIndex];
      typeText(typedQuestion, g.q);

      // RESET posisi tombol default tiap ganti gombalan
      resetButtonPos(btnTau);
      resetButtonPos(btnNgga);
      resetButtonPos(btnMau);
      resetButtonPos(btnGakMau);

      btnTau.style.display = 'inline-block';
      btnNgga.style.display = 'inline-block';
    }

    // TOMBOL JAWABAN
    btnTau.onclick = () => randomPos(btnTau);
    btnNgga.onclick = () => {
      const g = currentGombalan[currentIndex];
      btnTau.style.display = 'none'; btnNgga.style.display = 'none';
      typeText(typedAnswer, g.a, 40, () => {
        setTimeout(() => askAgainDiv.style.display = 'block', 2500);
      });
    };
    btnGakMau.onclick = () => randomPos(btnGakMau);
    btnMau.onclick = () => {
      currentIndex++;
      if (currentIndex >= currentGombalan.length) {
        stepGombal.style.display = 'none';
        step5.style.display = 'block';
        launchConfetti();
        return;
      }
      showGombal();
    };

    // REPEAT STEP 5
    repeatBtn.onclick = () => {
      step5.style.display = 'none';
      stepGombal.style.display = 'block';
      currentGombalan = gombalanSisa.sort(() => 0.5 - Math.random()).slice(0, 3);
      currentIndex = 0;

      // RESET posisi tombol tiap ulangi
      resetButtonPos(btnTau);
      resetButtonPos(btnNgga);
      resetButtonPos(btnMau);
      resetButtonPos(btnGakMau);

      showGombal();
    };

    // HEARTS
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.style.left = Math.random() * 90 + '%';
      h.style.width = h.style.height = (10 + Math.random() * 20) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 4800);
    }, 650);

    // CONFETTI
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth; canvas.height = innerHeight;
    window.addEventListener('resize', () => { canvas.width = innerWidth; canvas.height = innerHeight; });
    const pieces = [];
    function loopConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore();
        if (p.y > canvas.height + 60) pieces.splice(i, 1);
      }
      requestAnimationFrame(loopConfetti);
    }
    loopConfetti();
    function launchConfetti(n = 60) {
      for (let i = 0; i < n; i++) {
        pieces.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 220,
          y: canvas.height / 2 - 20 + (Math.random() - 0.5) * 80,
          vx: (Math.random() - 0.5) * 8,
          vy: -5 - Math.random() * 6,
          s: 6 + Math.random() * 12,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.4,
          color: `hsl(${320 + Math.random() * 60},80%,60%)`
        });
      }
    }
  </script>
</body>

</html>
